name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "scripts/ensure-aiqs-runtime-baseline.sh"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.EXPO_PUBLIC_SUPABASE_CLOUD_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate required secrets
        shell: bash
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || (echo "Missing secret: SUPABASE_ACCESS_TOKEN" && exit 1)
          [ -n "$SUPABASE_PROJECT_REF" ] || (echo "Missing secret: SUPABASE_PROJECT_REF" && exit 1)
          [ -n "$SUPABASE_DB_PASSWORD" ] || (echo "Missing secret: SUPABASE_DB_PASSWORD" && exit 1)

      - name: Log Supabase CLI version
        run: npx supabase@latest --version

      - name: Link Supabase project
        run: npx supabase@latest link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Resolve Supabase publishable key
        shell: bash
        run: |
          if [ -n "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "::add-mask::$SUPABASE_PUBLISHABLE_KEY"
            exit 0
          fi

          keys_json="$(npx supabase@latest projects api-keys --project-ref "$SUPABASE_PROJECT_REF" --output json)"
          publishable_key="$(printf '%s' "$keys_json" | jq -r '
            [
              .[]
              | select(((.name // .key // "") | test("anon|publishable"; "i")))
              | (.api_key // .key // .value // empty)
            ][0] // empty
          ')"

          if [ -z "$publishable_key" ]; then
            echo "Could not resolve Supabase publishable/anon key from project API keys." >&2
            exit 1
          fi

          echo "::add-mask::$publishable_key"
          echo "SUPABASE_PUBLISHABLE_KEY=$publishable_key" >> "$GITHUB_ENV"

      - name: Apply database migrations
        run: npx supabase@latest db push --linked --include-all

      - name: Generate AIQS deploy internal token
        shell: bash
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "ADMIN_AI_QUALITY_INTERNAL_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Configure production AIQS internal token
        run: npx supabase@latest secrets set ADMIN_AI_QUALITY_INTERNAL_TOKEN="$ADMIN_AI_QUALITY_INTERNAL_TOKEN" --project-ref "$SUPABASE_PROJECT_REF"

      - name: Log functions to deploy
        shell: bash
        run: |
          echo "Functions from repo:"
          find supabase/functions -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort

      - name: Deploy private edge functions
        run: |
          npx supabase@latest functions deploy process-entry --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
          npx supabase@latest functions deploy generate-reflection --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
          npx supabase@latest functions deploy regenerate-day-journal --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
          npx supabase@latest functions deploy import-chatgpt-markdown --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
          npx supabase@latest functions deploy renormalize-entry --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
          npx supabase@latest functions deploy admin-access-control --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
          npx supabase@latest functions deploy admin-ai-quality-studio --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
          npx supabase@latest functions deploy admin-regeneration-job --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt

      - name: Smoke admin access-control function
        shell: bash
        run: |
          response_file="$(mktemp)"
          http_status="$(
            curl -sS \
              -o "$response_file" \
              -w "%{http_code}" \
              -X POST \
              "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/admin-access-control" \
              -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
              -H "content-type: application/json" \
              -H "x-flow-id: deploy-smoke-admin-access-control" \
              --data '{"action":"my_access"}'
          )"

          flow="$(jq -r '.flow // empty' "$response_file")"
          code="$(jq -r '.code // empty' "$response_file")"

          if [ "$http_status" != "401" ] || [ "$flow" != "admin-access-control" ] || [ "$code" != "AUTH_MISSING" ]; then
            echo "admin-access-control smoke failed: status=$http_status flow=$flow code=$code" >&2
            cat "$response_file" >&2
            exit 1
          fi

          echo "admin-access-control smoke ok: status=$http_status code=$code"

      - name: Ensure production AIQS runtime baseline is live
        env:
          AIQS_BASELINE_TARGET: cloud
        run: npm run aiqs:runtime-baseline:ensure
